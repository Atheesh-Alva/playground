name: daily-standup-notify

on:
    push:
    # schedule:
    #     - cron: "*/5 * * * *"
    workflow_dispatch: {}

permissions:
    contents: write # required to push the cleared CSV back

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install requests
            - run: python scripts/standup_notify.py
              env:
                  TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
            - name: Commit cleared updates
              run: |
                  git config user.name "standup-bot"
                  git config user.email "standup-bot@users.noreply.github.com"
                  git add data/updates.csv data/updates_archive.csv
                  git diff --cached --quiet || git commit -m "chore: clear standup updates for $(date +%F)"
                  git push

            - name: MS Teams Notification
              if: always()
              uses: freenet-actions/ms-teams-deploy-card@master
              id: ms_teams_ostrum
              with:
                  github-token: ${{ github.token }}
                  webhook-uri: ${{ secrets.MS_TEAMS_PLAYGROUND_WEBHOOK_URI }}
                  show-on-start: false
                  card-layout-exit: complete
                  enable-review-diffs-action: false
                  include-files: false
